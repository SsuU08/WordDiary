<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>The Word Diary</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #fff;
  color: #111;

  width: 100%;
  min-height: 100vh;

  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* 전체 페이지 */
.page {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 20px 18px;
  gap: 28px;
}

/* 상단 타이틀 */
.header {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.header h1 {
  font-size: 1.8rem;
  font-weight: 700;
}

.header p {
  font-size: 0.85rem;
  color: #666;
  line-height: 1.4;
}

/* 서비스 메뉴 */
.menu {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
}

/* 인트로 */
.intro {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.intro .main {
  font-size: 1.1rem;
  font-weight: 500;
}

.intro .sub {
  font-size: 0.9rem;
  color: #666;
}

/* 랜덤 이디엄 */
.idiom {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.idiom .label {
  font-size: 0.75rem;
  color: #999;
}

.idiom .text {
  font-size: 1rem;
}

/* 리스트 */
.list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.item {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
  padding-bottom: 8px;
}

.date {
  font-size: 0.8rem;
  color: #999;
}

.subject {
  font-size: 1rem;
}

/* TOTAL */
.total {
  font-size: 0.9rem;
  color: #666;
}

/* 하단 */
.footer {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  border-top: 1px solid #eee;
  padding-top: 12px;
}
</style>
</head>

<body>

<div class="page">

  <!-- HEADER -->
  <div class="header">
    <h1>LIFE DIARY</h1>
    <p>Be not overcome of evil, but overcome evil with good.</p>
  </div>

  <!-- MENU -->
  <div class="menu">
    <span>Service</span>
    <span>Education</span>
    <span>Statistics</span>
  </div>

  <!-- INTRO -->
  <div class="intro">
    <div class="main">Let’s write God’s word on your heart</div>
    <div class="sub">Good Morning, Jisu.</div>
  </div>

  <!-- IDIOM -->
  <div class="idiom">
    <div class="label">RANDOM IDIOM</div>
    <div class="text">on the drawing board...</div>
  </div>

  <!-- LIST -->
  <div class="list">
    <div class="item">
      <span class="date">YYMMDD</span>
      <span class="subject">SUBJECT</span>
    </div>
    <div class="item">
      <span class="date">YYMMDD</span>
      <span class="subject">SUBJECT</span>
    </div>
    <div class="item">
      <span class="date">YYMMDD</span>
      <span class="subject">SUBJECT</span>
    </div>
  </div>

  <!-- TOTAL -->
  <div class="total">TOTAL</div>

  <!-- FOOTER -->
  <div class="footer">
    <span>Service</span>
    <span>Education</span>
    <span>Statistics</span>
  </div>

</div>

</body>
</html>
